version: '3.8' # Docker Compose version

services:

  # ─────────────────────────────────────────────
  # PostgreSQL - Shared Database cho toàn bộ cluster
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Nginx - Load Balancer đứng trước Keycloak cluster
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: keycloak-lb
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - keycloak-1
      - keycloak-2
    networks:
      - keycloak-net

  # ─────────────────────────────────────────────
  # Keycloak Node 1
  # ─────────────────────────────────────────────
  keycloak-1:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak-node-1

    # Có thể dùng start-dev (lab) hoặc start (chuẩn hơn)
    command: start-dev --cache=ispn --import-realm # <--- THÊM --import-realm

    environment:
      # Admin account
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

      # Database config
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}

      # Cache (phục vụ clustering)
      KC_CACHE: ispn
      KC_CACHE_STACK: tcp

      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"

      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"

    volumes:
      - keycloak_data_1:/opt/keycloak/data
      - ./keycloak/config/keycloak.conf:/opt/keycloak/conf/keycloak.conf
      - ./keycloak/themes:/opt/keycloak/themes
      - ./realm-export.json:/opt/keycloak/data/import/realm.json # <--- THÊM DÒNG NÀY

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - keycloak-net

    healthcheck:
      # Kiểm tra port 8080 đã mở chưa
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────
  # Keycloak Node 2
  # ─────────────────────────────────────────────
  keycloak-2:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak-node-2
    command: start-dev --cache=ispn --import-realm # <--- THÊM --import-realm

    environment:
      # (thêm admin cho đồng bộ)
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}

      KC_CACHE: ispn
      KC_CACHE_STACK: tcp

      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"

      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"

    volumes:
      - keycloak_data_2:/opt/keycloak/data
      - ./keycloak/config/keycloak.conf:/opt/keycloak/conf/keycloak.conf
      - ./keycloak/themes:/opt/keycloak/themes
      - ./realm-export.json:/opt/keycloak/data/import/realm.json # <--- THÊM DÒNG NÀY

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - keycloak-net

    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────
  # MyApp - Client ứng dụng sử dụng Keycloak (OIDC)
  # ─────────────────────────────────────────────
  myapp:
    build: ./myapp
    container_name: myapp-server
    restart: on-failure

    # Chờ Keycloak cluster sẵn sàng rồi mới start app
    command: >
      sh -c "until node -e \"fetch('http://nginx:8080/realms/master/.well-known/openid-configuration') .then(r => process.exit(r.ok ? 0 : 1)) .catch(() => process.exit(1))\"; do echo 'Waiting for Keycloak cluster...'; sleep 2; done; npm start"

    ports:
      - "${APP_PORT:-3000}:3000"

    environment:
      NODE_ENV: development
      APP_PORT: 3000

      # Trỏ về Load Balancer (không gọi trực tiếp node)
      KC_SERVER_URL: http://nginx:8080

      KC_REALM: ${KC_REALM}
      KC_CLIENT_ID: ${KC_CLIENT_ID}
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}

    volumes:
      - ./myapp:/usr/src/app
      - /usr/src/app/node_modules

    networks:
      - keycloak-net

    depends_on:
      - nginx

  # ─────────────────────────────────────────────
  # SAML - Client ứng dụng sử dụng Keycloak
  # ─────────────────────────────────────────────
  saml-test-sp:
    image: ghcr.io/beryju/saml-test-sp:latest
    container_name: saml-test-sp

    depends_on:
      - nginx

    ports:
      - "8081:9009"

    environment:
      - SP_ENTITY_ID=http://localhost:8081/saml/metadata
      # Sử dụng keycloak-lb để đi qua Nginx Load Balancer
      - SP_METADATA_URL=http://keycloak-lb:8080/realms/uit-keycloak-realm/protocol/saml/descriptor
      # THÊM DÒNG NÀY ĐỂ ĐỊNH NGHĨA LẠI ĐỊA CHỈ TRẢ VỀ CHUẨN
      - SP_ROOT_URL=http://localhost:8081
    networks:
      - keycloak-net

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  keycloak_data_1:
  keycloak_data_2:

    # ─────────────────────────────────────────────
    # Network nội bộ giữa các container
    # ─────────────────────────────────────────────
networks:
  keycloak-net:
    driver: bridge
