# ─────────────────────────────────────────────
# Proxy Configuration
# ─────────────────────────────────────────────
# Cho phép Keycloak đọc các header từ reverse proxy (Nginx)
# Quan trọng khi deploy sau Load Balancer
proxy-headers=xforwarded


# ─────────────────────────────────────────────
# Hostname Configuration
# ─────────────────────────────────────────────
# Tắt strict hostname để Keycloak chấp nhận request từ nhiều host khác nhau
# (ví dụ: localhost, nginx, container network)
hostname-strict=false


# ─────────────────────────────────────────────
# HTTP Configuration
# ─────────────────────────────────────────────
# Cổng chạy của Keycloak bên trong container
http-port=8080


# ─────────────────────────────────────────────
# Logging (Debug / Monitoring)
# ─────────────────────────────────────────────
# Mức log: INFO | DEBUG | WARN | ERROR
log-level=INFO