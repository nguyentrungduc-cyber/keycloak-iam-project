events {
    worker_connections 1024;
}

http {

    # ─────────────────────────────────────────────
    # Upstream: Keycloak Cluster (2 nodes)
    # ─────────────────────────────────────────────
    upstream keycloak_cluster {

        # Không dùng sticky session
        # ip_hash;

        # Nếu 1 node fail → Nginx sẽ thử node còn lại
        server keycloak-1:8080 max_fails=1 fail_timeout=10s;
        server keycloak-2:8080 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8080;

        location / {

            # Forward request đến cluster
            proxy_pass http://keycloak_cluster;

            # ─────────────────────────────────────
            # Timeout config
            # ─────────────────────────────────────
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;

            # Khi node lỗi → tự động retry node khác
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;

            # ─────────────────────────────────────
            # Proxy headers
            # ─────────────────────────────────────
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 8080;

            # Trả về hostname của node xử lý request
            add_header X-Served-By $upstream_addr;
            
            # ─────────────────────────────────────
            # HTTP settings (tránh lỗi connection)
            # ─────────────────────────────────────
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}